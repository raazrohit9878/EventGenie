<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" />
    <title>EventGenie AI — Your event, beautifully planned</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#mainContent">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#home" aria-label="EventGenie home"
          ><span class="brand-mark">✳</span
          ><span>eventgenie<span class="brand-ai">AI</span></span></a
        >
        <div class="workspace-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-item active" data-view="home"><span>⌂</span> Overview</button>
          <button class="nav-item" data-view="budget"><span>◉</span> Budget</button>
          <button class="nav-item" data-view="timeline"><span>◷</span> Timeline</button>
          <button class="nav-item" data-view="vendors"><span>◇</span> Vendors</button>
          <button class="nav-item" data-view="guests"><span>♧</span> Guests</button>
          <button class="nav-item" data-view="ideas"><span>✧</span> AI ideas</button>
          <button class="nav-item" data-view="reports"><span>▤</span> Reports</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-icon">✦</div>
            <strong>Need a little magic?</strong>
            <p>Ask your AI event assistant for ideas.</p>
            <button class="text-button" data-view="assistant">
              Chat with Genie <span>→</span>
            </button>
          </div>
          <div class="profile">
            <div class="avatar">P</div>
            <div class="profile-copy">
              <strong>Priya Sharma</strong><small>Demo workspace</small>
            </div>
            <button class="icon-button" title="Profile settings" id="profileBtn">•••</button>
          </div>
        </div>
      </aside>
      <main class="main-area" id="mainContent" tabindex="-1">
        <header class="topbar">
          <button
            class="mobile-menu icon-button"
            id="menuBtn"
            aria-label="Open menu"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            ☰
          </button>
          <div class="breadcrumb">
            My workspace <span>/</span> <strong id="crumb">Overview</strong>
          </div>
          <div class="top-actions">
            <span class="demo-badge" id="storageBadge"><span></span> Local demo</span
            ><button
              class="icon-button notification-button"
              id="notificationsBtn"
              aria-label="Notifications"
            >
              ♧<i></i>
            </button>
            <div class="avatar small" id="topAvatar" aria-hidden="true">P</div>
          </div>
        </header>
        <section class="page-content" id="pageContent"></section>
      </main>
    </div>
    <button
      class="chat-fab"
      id="chatFab"
      aria-label="Open EventGenie chat"
      aria-controls="chatWidget"
      aria-expanded="false"
    >
      ✳<span>Chat with Genie</span>
    </button>
    <section
      class="chat-widget"
      id="chatWidget"
      role="dialog"
      aria-label="EventGenie AI chat"
      aria-modal="false"
      hidden
    >
      <header class="chat-widget-head">
        <div class="chat-brand-icon">✳</div>
        <div>
          <strong>Genie, your event planner</strong
          ><small id="chatWidgetStatus">AI powered by NVIDIA NIM</small>
        </div>
        <div class="chat-widget-actions">
          <button
            class="icon-button"
            id="clearChatBtn"
            title="Clear conversation"
            aria-label="Clear conversation"
          >
            ⌫</button
          ><button class="icon-button" id="closeChatBtn" title="Close chat" aria-label="Close chat">
            ✕
          </button>
        </div>
      </header>
      <div
        class="chat-widget-messages"
        id="widgetMessages"
        role="log"
        aria-label="Conversation with Genie"
        aria-live="polite"
        aria-relevant="additions"
        aria-atomic="false"
      ></div>
      <div class="chat-quick-prompts">
        <button data-prompt="What tasks are pending?">Pending tasks</button
        ><button data-prompt="Suggest three wedding themes">Wedding themes</button>
      </div>
      <div class="chat-error-area" id="widgetChatError" role="alert" aria-live="assertive"></div>
      <form class="chat-compose widget-compose">
        <input
          class="chat-input"
          placeholder="Ask about your event…"
          autocomplete="off"
          aria-label="Message EventGenie AI"
        /><button class="primary-button" aria-label="Send message">↑</button>
      </form>
    </section>
    <div id="modalRoot"></div>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
